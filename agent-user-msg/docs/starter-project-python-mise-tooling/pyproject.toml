[project]
name = "starter"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

# Dev tools live here (not in mise) so uv.lock pins them and every
# machine, CI runner and agent uses the exact same versions.
[dependency-groups]
dev = [
    "commitizen>=4.19.1",
    "nbstripout>=0.9.1",
    "prek>=0.5.5",
    "pyrefly>=1.3.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
    "ty>=0.0.84",
]

[tool.uv]
default-groups = ["dev"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [
    "data", "models", "outputs", "agent-user-msg",
    ".agents", ".claude", ".codex", ".devcontainer",
]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "N",        # pep8-naming
    "PTH",      # use pathlib
    "S",        # bandit security checks
    "RUF",      # ruff-specific
    "ANN",      # require annotations (keeps the type checkers useful)
    "PL",       # pylint subset
    "T20",      # no stray print() in library code
]
ignore = [
    "PLR2004",  # magic numbers are fine in ML code (lr=3e-4, etc.)
    "PLR0913",  # ML functions legitimately take many args
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN", "PLR2004"]
"**/*.ipynb" = ["T20", "ANN", "E402"]
"scripts/**" = ["T20"]

[tool.ruff.format]
docstring-code-format = true

# ---------------------------------------------------------------- types
# Pyrefly (stable 1.x) is the CI gate. Set the preset explicitly: an
# unconfigured project gets "basic", which hides most errors.
[tool.pyrefly]
preset = "strict"
project-includes = ["src", "tests"]

# ty (Astral, 0.0.x) runs via `mise run typecheck:ty` as a second
# opinion. It catches a different set of bugs than pyrefly.
[tool.ty.src]
include = ["src", "tests"]

# ---------------------------------------------------------------- tests
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
markers = [
    "slow: long-running tests (training loops, large fixtures)",
    "gpu: requires a CUDA/MPS device",
    "integration: hits external services such as LLM APIs",
]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

# ---------------------------------------------------------------- commits
[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "uv"          # bumps pyproject.toml *and* uv.lock
tag_format = "v$version"
update_changelog_on_bump = true
major_version_zero = true        # breaking changes bump 0.x minor until you go 1.0
